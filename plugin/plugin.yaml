name: ownmachine
# Load operator commands before a computer-use provider is selected.
# The native provider remains available through Hermes category discovery.
kind: standalone
version: 0.6.0
manifest_version: 2
api_version: 1
description: Native Hermes computer use for a persistent private macOS VM
license: PolyForm-Noncommercial-1.0.0
requires_hermes: ">=0.23.1"
python_dependencies:
  - "websockets==15.0.1"
config_schema:
  setup_reminder_destination: {type: dict, default: {}, description: "Explicit scheduled reminder destination: platform, user_id, chat_id and optional thread_id"}
  setup_reminder_timezone: {type: str, default: "UTC", description: "IANA time zone for reminder previews; timestamps remain UTC"}
  setup_reminder_limit: {type: int, default: 3, description: "Maximum reminders per verified setup stage, 1–3; at most one delivered per 24 hours"}
  setup_progress_interval_seconds: {type: int, default: 30, description: "Chat elapsed-time updates every 5–300 seconds, capped at 20; remote success requires an authenticated receipt"}
  setup_ssh_config: {type: str, default: "", description: "Optional absolute operator-owned OpenSSH config, passed to ssh -F; no credential files are read by the plugin"}
  setup_host_alias: {type: str, default: "", description: "Separate pinned SSH alias for the temporary fixed-command setup endpoint; never the agent runtime alias"}
  setup_source_sha256: {type: str, default: "", description: "Reviewed full-source fingerprint reported by setup-endpoint.py --fingerprint"}
  setup_timeout_seconds: {type: int, default: 120, description: "Explicit bounded setup call timeout, 5–7500 seconds; use a longer value for build/provision"}
  setup_guide_ref: {type: str, default: "", description: "Optional immutable vVERSION or full commit for development docs; empty derives the release tag from plugin version"}
  setup_allowed_senders: {type: list, default: [], description: "Explicit chat mutation grants: objects with platform, user_id and chat_id; missing identity is refused. Local CLI setup remains available."}
  setup_plan: {type: dict, default: {}, description: "Non-secret resumable operator setup plan; saving a plan does not provision a VM"}
  control_dir: {type: str, default: "", description: "Absolute operator-owned control directory shared by every profile targeting this VM"}
  host_alias: {type: str, default: "", description: "Owner-configured SSH alias for the VM host"}
  vm_name: {type: str, default: "ownmachine"}
  connect_timeout_seconds: {type: int, default: 15}
  action_timeout_seconds: {type: int, default: 30}
provides_hooks:
  - on_session_open
provides_tools:
  - ownmachine_status
provides_middleware:
  - tool_execution

# Command inventory (advisory metadata); public ctx.register_* APIs load these.
commands:
  - ownmachine
